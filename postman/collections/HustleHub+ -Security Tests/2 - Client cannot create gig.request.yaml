$kind: http-request
url: https://localhost:5000/api/gigs
method: POST
body:
  type: json
  content: "{}"
auth:
  type: bearer
  credentials:
    token: "{{clientToken}}"
scripts:
  - type: afterResponse
    code: "\r

      pm.test(\"Client cannot create a gig - 403 Forbidden\", function () {\r

      \    pm.response.to.have.status(403);\r

      });\r

      \r

      pm.test(\"Response contains permission error\", function () {\r

      \    const response = pm.response.json();\r

      \    pm.expect(response.error).to.be.a(\"string\");\r

      \    pm.expect(response.error.toLowerCase()).to.include(\"permission denied\");\r

      });\r\n"
    language: text/javascript
order: 2000
