$kind: http-request
url: https://localhost:5000/api/bookings/{{cancelBookingId}}/cancel
method: PATCH
auth:
  type: bearer
  credentials:
    token: "{{clientToken}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Client cancels booking - 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Booking status changes to cancelled\", function () {\r

      \    const response = pm.response.json();\r

      \r

      \    pm.expect(response.booking.status).to.eql(\"cancelled\");\r

      });\r

      \r

      pm.test(\"Cancellation creates a refund transaction\", function () {\r

      \    const response = pm.response.json();\r

      \r

      \    pm.expect(response.transaction).to.exist;\r

      \    pm.expect(response.transaction.type).to.eql(\"refund\");\r

      \    pm.expect(response.transaction.amountCents).to.be.below(0);\r

      });"
    language: text/javascript
order: 25000
