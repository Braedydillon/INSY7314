$kind: http-request
url: https://localhost:5000/api/bookings/mybookings
method: GET
order: 21000
auth:
  type: bearer
  credentials:
    token: "{{clientToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Client can view own bookings - 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response includes bookings array", function () {
          pm.expect(pm.response.json().bookings).to.be.an("array");
      });
