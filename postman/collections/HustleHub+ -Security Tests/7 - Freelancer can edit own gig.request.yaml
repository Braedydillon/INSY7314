$kind: http-request
url: https://localhost:5000/api/gigs/{{createdGigId}}
method: PUT
body:
  type: json
  content: "\r

    {\r

    \  \"title\": \"Updated Lane B Test Gig\",\r

    \  \"category\": \"design\",\r

    \  \"description\": \"Updated by the freelancer who owns this gig.\",\r

    \  \"tiers\": [\r

    \    {\r

    \      \"title\": \"Basic Package\",\r

    \      \"description\": \"A basic website design package.\",\r

    \      \"priceCents\": 50000\r

    \    }\r

    \  ]\r

    }\r

    \  "
auth:
  type: bearer
  credentials:
    token: "{{freelancerToken}}"
scripts:
  - type: afterResponse
    code: "\r

      pm.test(\"Freelancer can edit own gig - 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Gig title was successfully updated\", function () {\r

      \    const response = pm.response.json();\r

      \r

      \    pm.expect(response.gig).to.be.an(\"object\");\r

      \    pm.expect(response.gig.title).to.eql(\"Updated Lane B Test Gig\");\r

      });\r\n"
    language: text/javascript
order: 7000
