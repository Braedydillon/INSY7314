$kind: http-request
url: https://localhost:5000/api/bookings
method: POST
body:
  type: json
  content: "{\r

    \  \"gigId\": \"{{createdGigId}}\",\r

    \  \"tierId\": \"{{createdTierId}}\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{clientToken}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Client can create a booking - 201 Created\", function () {\r

      \    pm.response.to.have.status(201);\r

      });\r

      \r

      pm.test(\"Booking and payment transaction are created\", function () {\r

      \    const response = pm.response.json();\r

      \r

      \    pm.expect(response.booking).to.be.an(\"object\");\r

      \    pm.expect(response.transaction).to.be.an(\"object\");\r

      \    pm.expect(response.transaction.type).to.eql(\"payment\");\r

      });\r

      \r

      if (pm.response.code === 201) {\r

      \    const response = pm.response.json();\r

      \r

      \    pm.collectionVariables.set(\"createdBookingId\",
      response.booking._id);\r

      }"
    language: text/javascript
  - type: beforeRequest
    code: ""
    language: text/javascript
examples: .resources/8 - Client creates booking.resources/examples
