$kind: http-request
url: https://localhost:5000/api/users/me
method: PATCH
body:
  type: json
  content: "{\r

    \  \"displayName\": \"Security Test Client\",\r

    \  \"contactMethod\": \"securitytest@example.com\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{clientToken}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Client can update profile - 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Profile update returns success message\", function () {\r

      \    const response = pm.response.json();\r

      \r

      \    pm.expect(response.message).to.eql(\"Profile updated successfully.\");\r

      });\r

      \r

      pm.test(\"Updated profile contains correct details\", function () {\r

      \    const response = pm.response.json();\r

      \r

      \    pm.expect(response.user.displayName).to.eql(\"Security Test Client\");\r

      \    pm.expect(response.user.contactMethod).to.eql(\"securitytest@example.com\");\r

      });\r

      \r

      pm.test(\"Updated profile does not expose password hash\", function () {\r

      \    const response = pm.response.json();\r

      \r

      \    pm.expect(response.user).not.to.have.property(\"passwordHash\");\r

      });"
    language: text/javascript
order: 34000
