$kind: http-request
url: https://localhost:5000/api/users/me
method: PATCH
body:
  type: json
  content: "{\r\n  \"role\": \"admin\"\r\n}"
auth:
  type: bearer
  credentials:
    token: "{{clientToken}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Client cannot change own role - 400 Bad Request\", function () {\r

      \    pm.response.to.have.status(400);\r

      });\r

      \r

      pm.test(\"Response contains validation errors\", function () {\r

      \    const response = pm.response.json();\r

      \r

      \    pm.expect(response).to.have.property(\"errors\");\r

      \    pm.expect(response.errors).to.be.an(\"array\").that.is.not.empty;\r

      });"
    language: text/javascript
order: 35000
