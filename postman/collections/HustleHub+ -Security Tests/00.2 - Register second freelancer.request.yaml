$kind: http-request
url: https://localhost:5000/api/auth/register
method: POST
body:
  type: json
  content: "{\r

    \  \"name\": \"RBAC\",\r

    \  \"surname\": \"Freelancer\",\r

    \  \"displayName\": \"RBAC Freelancer B\",\r

    \  \"email\": \"rbac.freelancer2@test.com\",\r

    \  \"password\": \"TestPassword123!\",\r

    \  \"role\": \"freelancer\"\r

    }"
scripts:
  - type: afterResponse
    code: "\r

      pm.test(\"Second freelancer registration succeeds or account already exists\", function () {\r

      \    pm.expect(pm.response.code).to.be.oneOf([200, 201, 400, 409]);\r

      });\r

      \r

      pm.test(\"Second freelancer registration returns an expected response\", function () {\r

      \    const response = pm.response.json();\r

      \r

      \    if ([200, 201].includes(pm.response.code)) {\r

      \        pm.expect(response).to.be.an(\"object\");\r

      \    } else {\r

      \        const message = response.error || response.message || \"\";\r

      \r

      \        pm.expect(message).to.be.a(\"string\").and.not.empty;\r

      \        pm.expect(message.toLowerCase()).to.match(/already|exist|duplicate/);\r

      \    }\r

      });\r\n"
    language: text/javascript
order: 569
