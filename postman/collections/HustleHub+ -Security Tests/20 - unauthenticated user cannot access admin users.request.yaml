$kind: http-request
url: https://localhost:5000/api/admin/users
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Unauthenticated user cannot access admin users - 401\", function () {\r

      \    pm.response.to.have.status(401);\r

      });\r

      \r

      pm.test(\"Response contains authentication error\", function () {\r

      \    const response = pm.response.json();\r

      \r

      \    pm.expect(response).to.have.property(\"error\");\r

      \    pm.expect(response.error).to.eql(\"Authentication required.\");\r

      });"
    language: text/javascript
order: 29000
