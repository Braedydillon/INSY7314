$kind: http-request
url: https://localhost:5000/api/bookings
method: POST
order: 20000
body:
  type: json
  content: |-
    {
      "gigId": "{{createdGigId}}",
      "tierId": "{{createdTierId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Booking creation requires authentication - 401", function () {
          pm.response.to.have.status(401);
      });

      pm.test("Response contains an error message", function () {
          pm.expect(pm.response.json().error).to.be.a("string");
      });
