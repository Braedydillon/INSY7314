$kind: http-request
url: https://localhost:5000/api/bookings/{{declineBookingId}}/decline
method: PATCH
auth:
  type: bearer
  credentials:
    token: "{{freelancerToken}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Freelancer declines booking - 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Booking status changes to declined\", function () {\r

      \    const response = pm.response.json();\r

      \    pm.expect(response.booking.status).to.eql(\"declined\");\r

      });\r

      \r

      pm.test(\"Declining booking creates a refund\", function () {\r

      \    const response = pm.response.json();\r

      \r

      \    pm.expect(response.transaction).to.exist;\r

      \    pm.expect(response.transaction.type).to.eql(\"refund\");\r

      \    pm.expect(response.transaction.amountCents).to.be.below(0);\r

      });"
    language: text/javascript
order: 26000
