$kind: http-request
name: 8 - Client creates booking
url: https://localhost:5000/api/bookings
method: POST
body:
  type: json
  content: "{\r

    \  \"gigId\": \"{{createdGigId}}\",\r

    \  \"tierId\": \"{{createdTierId}}\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{clientToken}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Client can create booking - 201\", function () {\r

      \    pm.response.to.have.status(201);\r

      });\r

      \r

      pm.test(\"Booking and transaction are created\", function () {\r

      \    const response = pm.response.json();\r

      \r

      \    pm.expect(response.booking).to.exist;\r

      \    pm.expect(response.transaction).to.exist;\r

      });\r

      \r

      if (pm.response.code === 201) {\r

      \    const response = pm.response.json();\r

      \r

      \    const bookingId = response.booking.id || response.booking._id;\r

      \r

      \    pm.collectionVariables.set(\"createdBookingId\", bookingId);\r

      }"
    language: text/javascript
  - type: beforeRequest
    code: ""
    language: text/javascript
examples: .resources/8 - Client creates booking-1.resources/examples
order: 11000
