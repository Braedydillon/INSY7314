services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    env_file:
      - ./api/.env
    environment:
      PORT: "5000"
      USE_HTTPS: "false"
      MONGODB_URI: mongodb://mongo:27017/hustlehub
      CLIENT_ORIGIN: http://localhost:8081
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      APP_URL: http://localhost:8081
      TRUST_PROXY: "1"
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build: ./client
    restart: unless-stopped
    ports:
    - "127.0.0.1:8081:80"
    depends_on:
      - api

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  mongo_data:
